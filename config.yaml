# JARVIS 2.0 User Configuration
# Centralized config — all settings are loaded dynamically by jarvis/config.py

assistant:
  name: "Ai Partner"
  greeting_name: "Boss"
  default_language: "en-in"

llm:
  provider: "gemini"
  model: "gemini-3.6-flash"
  # Legacy single-model fallback list, retained for compatibility.
  # Phase 0.5 routing uses the `models:` + `routing:` blocks below instead.
  fallback_models:
    - "gemini-3.5-flash-lite"
  max_model_attempts: 2
  max_tool_rounds: 8          # Safety bound on tool-call round trips per user message
  temperature: 0.7
  max_output_tokens: 1024
  max_history_messages: 20    # Cap conversation history to control token usage

# ============================================================================
# Phase 0.5 — provider-agnostic model layer
# ============================================================================
# Providers are defined here; credentials come from the environment variable
# named by `api_key_env`. Never put a key in this file.
providers:

  gemini:
    type: gemini
    enabled: true
    api_key_env: GEMINI_API_KEY
    default_model: "gemini-3.6-flash"
    context_window: 1048576

  openrouter:
    type: openai_compatible
    enabled: true
    api_key_env: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    context_window: 1000000

  # OpenCode Zen serves an OpenAI-compatible API and hosts the community
  # "Space Bunny" / "Big Pickle" models. Verified against its /models endpoint;
  # these are NOT OpenRouter models.
  opencode_zen:
    type: openai_compatible
    enabled: true
    api_key_env: OPENCODE_ZEN_API_KEY
    base_url: "https://opencode.ai/zen/v1"
    context_window: 1048576

# ---------------------------------------------------------------------------
# Model registry. Adding/removing/disabling a model is a change to this block
# only — no Python edits required.
#
# `verified: true` means the model id, context length, free status and
# tool-calling support were checked against the live provider catalog.
# `verified: false` means those claims are UNCONFIRMED; the router penalises
# unverified models so they cannot silently outrank verified ones.
# ---------------------------------------------------------------------------
models:

  # ---- Google Gemini (verified live) ----
  gemini_flash:
    provider: gemini
    model: "gemini-3.6-flash"
    enabled: true
    priority: 90
    free: false
    context_window: 1048576
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "Returned 429 on the free tier during testing; gemini_3_5_flash_lite responded."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: true
      vision: true
      structured_output: true
      long_context: true
      streaming: true
    task_affinity:
      coding: 10
      reasoning: 10

  gemini_flash_lite:
    provider: gemini
    model: "gemini-3.5-flash-lite"
    enabled: true
    priority: 70
    free: false
    context_window: 1048576
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "Confirmed responding live ('2+2' -> '4') when gemini-3.6-flash was quota-limited."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: true
      vision: true
      structured_output: true
      long_context: true
      streaming: true
    task_affinity:
      casual_conversation: 10

  # ---- OpenRouter free models (catalog-verified, live calls unverified) ----
  nemotron_3_5_lightning:
    provider: openrouter
    model: "nvidia/nemotron-3.5-lightning:free"
    enabled: true
    priority: 85
    free: true
    context_window: 1000000
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "Catalog confirms 1M context and tools support. Live call unverified: no OPENROUTER_API_KEY configured."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: true
      vision: false
      structured_output: true
      long_context: true
      streaming: true
    task_affinity:
      coding: 15
      reasoning: 15

  nemotron_3_ultra:
    provider: openrouter
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    enabled: true
    priority: 80
    free: true
    context_window: 1000000
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "Catalog confirms 1M context and tools support. Live call unverified."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: true
      vision: false
      structured_output: true
      long_context: true
      streaming: true
    task_affinity:
      reasoning: 20

  nemotron_3_super:
    provider: openrouter
    model: "nvidia/nemotron-3-super-120b-a12b:free"
    enabled: true
    priority: 75
    free: true
    context_window: 262144
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "Catalog confirms 256k context and tools support. Live call unverified."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: true
      vision: false
      structured_output: true
      long_context: true
      streaming: true

  inclusionai_ling_3_flash:
    provider: openrouter
    model: "inclusionai/ling-3.0-flash-sante:free"
    enabled: true
    priority: 70
    free: true
    context_window: 262144
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "Catalog confirms 256k context and tools support. Live call unverified."
    capabilities:
      reasoning: false
      coding: true
      conversation: true
      tool_calling: true
      vision: false
      structured_output: false
      long_context: true
      streaming: true
    task_affinity:
      casual_conversation: 15

  # ---- OpenCode Zen community free models (catalog-verified) ----
  space_bunny_free:
    provider: opencode_zen
    model: "space-bunny-free"
    enabled: true
    priority: 78
    free: true
    context_window: 1048576
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "ID verified on https://opencode.ai/zen/v1/models. NOT an OpenRouter model. Live call unverified: no OPENCODE_ZEN_API_KEY configured."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: false
      vision: false
      structured_output: false
      long_context: true
      streaming: false

  # KNOWN ROUTING ISSUE — disabled until API accessibility is verified.
  # `big-pickle` is listed in the Zen catalog and is priced Free, but a live
  # call returned HTTP 403 {"type":"FreeTierError","message":"OpenCode's free
  # tier can only be used from within OpenCode"}. It is therefore unusable
  # from this client. Keeping it enabled was actively harmful: the 403 is
  # classified as an auth error (non-retryable), so selecting it aborted the
  # whole request instead of falling back. Re-enable only after a live call
  # from outside the OpenCode client succeeds.
  big_pickle:
    provider: opencode_zen
    model: "big-pickle"
    enabled: false
    priority: 68
    free: true
    context_window: 262144
    max_output_tokens: 8192
    verified: true
    verified_on: "2026-10-06"
    notes: "ID and $0 pricing verified against https://opencode.ai/docs/zen and the /models catalog. DISABLED: live call returned HTTP 403 FreeTierError ('free tier can only be used from within OpenCode'), so it cannot be routed to from this client. tool_calling marked false because the Zen catalog does not advertise it and generation is blocked entirely."
    capabilities:
      reasoning: true
      coding: true
      conversation: true
      tool_calling: false
      vision: false
      structured_output: false
      long_context: true
      streaming: false
    task_affinity:
      creative: 15

# ---------------------------------------------------------------------------
# Router configuration. Deterministic weighted scoring; no model calls, no ML.
# ---------------------------------------------------------------------------
routing:
  enabled: true
  strategy: capability_score

  # Weights sum to 1.0 (normalised at load time).
  capability_weight: 0.30    # can the model actually do this task
  task_weight: 0.25          # declared affinity for the classified task
  reliability_weight: 0.25   # measured success rate
  latency_weight: 0.10       # measured latency, bounded so it cannot dominate
  priority_weight: 0.10      # operator-configured preference

  cooldown_seconds: 60       # base backoff after a retryable failure
  max_attempts: 4            # max models tried in one request before failing
  probe_cooling_models: true # retry the nearest-to-expiry model instead of deadlocking
  prefer_free: true
  latency_reference_ms: 4000 # latency at which the latency score reaches ~0.5

debug:
  # Development-only: log exact user input, routing decision, chosen model.
  log_input: false

weather:
  default_city: "Delhi"

# ============================================================================
# Local applications (Phase 3) — safe application launching
# ============================================================================
# Only applications listed here may be launched by the local launch handler
# (`open -a` via argument-list subprocess, never a shell). Matching is
# case-insensitive; anything else is rejected locally with no provider call.
# Default deny: an empty or missing list means nothing is launchable.
applications:
  allowed: []
  # Examples (uncomment to enable):
  # - WhatsApp
  # - Safari

contacts:
  # Email contact aliases
  # mom: "example_mom@gmail.com"
  # primary: "user@example.com"

locations:
  # Optional custom map search target
  default_maps_query: "Delhi"

speech:
  # TTS Engine: "chatterbox" (active, voice-cloned from a reference WAV),
  # "kokoro" (legacy) or "pyttsx3" (basic platform TTS)
  tts_engine: "chatterbox"
  # Chatterbox voice identity. Path relative to the project root (this repo's
  # Model/ directory); an absolute path also works.
  chatterbox_reference_audio: "chatterbox_emotion_test.wav"
  chatterbox_device: "auto"    # auto -> mps/cuda when available, else cpu
  chatterbox_exaggeration: 0.5
  chatterbox_cfg_weight: 0.5
  chatterbox_temperature: 0.8
  # What to do if Chatterbox fails: "console" (default, text only) or "pyttsx3".
  # Chatterbox never silently falls back to Kokoro.
  chatterbox_fallback_engine: "console"
  # Legacy Kokoro settings (unused unless tts_engine is set back to "kokoro")
  kokoro_voice: "am_adam"     # Voices: am_adam, am_michael, af_sarah, af_bella, bf_emma, bm_george
  kokoro_lang: "a"           # 'a' for American English, 'b' for British English
  kokoro_speed: 1.0          # Speed multiplier (e.g. 1.0, 1.1)
  pyttsx3_rate: 180

# ============================================================================
# Voice (Phase 4) — wake word, endpointing, conversation window
# ============================================================================
# The wake word is opt-in, like the webcam. While `enabled` is false the
# microphone is never opened, the wake-word model is never loaded, and voice
# turns nothing off: text conversation is unaffected either way.
wake_word:
  enabled: false
  model: "hey_jarvis"        # Pre-trained model: hey_jarvis, hey_mycroft, alexa, etc.
  threshold: 0.5             # Confidence threshold (0.0-1.0), higher = more strict
  # Assistant speech ignored after playback stops, so the tail of a reply cannot
  # re-trigger the wake word through the speakers.
  echo_cooldown_seconds: 0.6
  # Multi-phrase wake configuration (Phase 8). Each entry names its own
  # openWakeWord model and threshold; all active models share the one
  # microphone stream via a single inference call. Only entries verified
  # against the installed openWakeWord 0.6.0 catalog may be enabled: that is
  # just "hey_jarvis". "jarvis" has no verified built-in model and stays
  # disabled until a custom model is provided -- a config entry is not proof
  # of phrase support. Legacy `model`/`threshold` above remain the fallback
  # when `phrases` is absent.
  phrases:
    - phrase: "hey jarvis"
      model: "hey_jarvis"
      threshold: 0.5
      enabled: true
    - phrase: "jarvis"
      model: ""
      threshold: 0.5
      enabled: false

# Voice activity detection (energy based, local, no extra dependency).
vad:
  energy_threshold: 0.01     # RMS (0..1) at which a frame counts as voiced
  min_speech_ms: 200         # voiced time before a burst is a real utterance
  end_silence_ms: 700        # quiet time that ends the utterance
  barge_in_ms: 300           # voiced time needed to interrupt the assistant
  # Speech must clear the measured room floor by these margins. The absolute
  # threshold above is only the floor of that decision, so a quiet room behaves
  # as configured and a noisy one stops reading the noise as speech.
  snr: 3.0
  barge_in_snr: 4.0
  # barge_in_threshold defaults to 2x energy_threshold; uncomment to override.
  # barge_in_threshold: 0.02

conversation:
  follow_up_window_s: 8      # keep listening this long after speaking
  sample_rate: 16000         # int16 mono; shared by wake word, VAD and ASR
  frame_ms: 80               # 80ms frames (~200 wake-word inferences/second)
  tts_chunk_ms: 220          # speech synthesis chunk size
  # input_device: 1          # microphone index; omit for the system default

# ============================================================================
# Conversation state (Phase 5) -- how JARVIS is talking right now
# ============================================================================
# Personality ("who JARVIS is") is the identity prompt and is not configured
# here. This is the dynamic layer around it: the tone of the current
# conversation. It decays, and it is never written to memory.
conversation_state:
  enabled: true

  defaults:
    mood: neutral
    conversation_mode: casual
    energy: 0.55
    warmth: 0.75
    curiosity: 0.60

  decay:
    enabled: true
    half_life_seconds: 300   # temporary state relaxes back to defaults

# ============================================================================
# Proactive Partner (Phase 6)
# ============================================================================
# When JARVIS may initiate conversation. All gates are conservative by default.
# The default answer is NO — most observations result in silence.
proactive:
  enabled: true

  # Global cooldown in seconds after any proactive interaction.
  # Prevents repeated speech on the same event.
  global_cooldown_seconds: 300

  # Per-reason cooldown overrides (seconds). Same reason won't trigger again
  # within this window.
  per_reason_cooldown_seconds: {}

  # Maximum proactive interactions per rolling window.
  max_interactions_per_window: 3
  window_seconds: 3600  # rolling window for the limit above

  # Availability gates
  require_available: true
  probably_available_evidence:
    - "recent user interaction"
    - "explicit user request"
    - "no active conversation"
    - "cooldown expired"

  # Deduplication
  dedup_window_seconds: 600  # same reason won't trigger twice within this window

  # Quiet hours — when proactive is suppressed regardless of other gates
  quiet_hours:
    enabled: false
    start_hour: 22   # 10 PM
    end_hour: 8      # 8 AM

  # Confidence threshold for a candidate to even be considered
  confidence_threshold: 0.5

  # Observation gating
  require_persistence: true  # one-frame observations are not meaningful
  min_repeat_observations: 2  # consecutive meaningful readings before candidacy

  # Style/tone integration
  tone_influence: true  # Phase 5 tone influences proactive wording
  style_hint_weight: 0.3  # how much tone shapes (0.0-1.0), never overrides

# ============================================================================
# Vision / Perception (Phase 3)
# ============================================================================
# Images you attach are always analysed — there is nothing to enable for that.
# The webcam is a separate, deliberate opt-in and is OFF unless you turn it on.
vision:
  enabled: true

  webcam:
    # The camera is never opened unless this is true. Default is false.
    enabled: false
    device: 0                 # 0 = default camera
    interval_seconds: 10      # sample one frame this often
    analysis_cooldown_seconds: 120   # hard ceiling on vision calls
    # Fraction of the frame that must have changed for a frame to be analysed.
    # 0.02 catches a person arriving/leaving and objects appearing/going, and
    # ignores lighting drift and sensor noise entirely. Fine changes (glasses)
    # score ~0.012; lower this to 0.005 to catch them -- the cooldown above
    # still bounds the cost.
    change_threshold: 0.02
    change_noise_floor: 0.06        # brightness move counted as a real change
    comparison_size: 32             # edge size frames are reduced to for comparison
    context_ttl_seconds: 600  # how long the current visual context stays usable
    max_observations: 6       # observations kept in the current visual context
    max_frame_side: 640       # frames are downscaled to this before analysis
    jpeg_quality: 70

logging:
  # Phase 8: Rotating file logging
  level: "INFO"              # DEBUG, INFO, WARNING, ERROR, CRITICAL
  max_bytes: 1000000         # 1 MB per log file before rotation
  backup_count: 3            # Number of backup files to keep
